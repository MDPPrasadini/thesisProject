<!DOCTYPE html>
<html>
<head>
<title>AI Lecture Search</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<h1>AI Lecture Search</h1>

<input type="file" id="fileInput">
<button onclick="upload()">Upload Lecture</button>
<h3>Or download lecture by URL</h3>

<input
  id="lectureUrl"
  type="text"
  placeholder="Paste lecture URL"
/>

<button onclick="downloadLecture()">
  Download & Transcribe
</button>
<br><br>

<input type="text" id="searchBox" placeholder="Search lecture...">
<button onclick="search()">Search</button>

<br><br>

<video id="video" width="700" controls></video>

<div id="results"></div>

<script src="app.js"></script>
</body>
</html>
