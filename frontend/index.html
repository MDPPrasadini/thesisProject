<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>AI Lecture Search - DSV</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- TOP BANNER -->
  <header class="top-banner">
    <div class="container banner-content">
      <img src="su_swe.png" class="logo" alt="SU Logo">
      <div class="department">
        Department of Computer and Systems Sciences (DSV)
      </div>
    </div>
  </header>

  <!-- MAIN CONTENT -->
  <main class="container content">

    <h1>AI Lecture Search</h1>

    <!-- UPLOAD -->
    <section class="block">
      <input type="file" id="fileInput" class="input-box">
      <div class="upload-row">
        <button onclick="upload()" class="btn">Upload Lecture</button>

        <div id="status" class="status"></div>
      </div>
    </section>
    <!-- STATUS -->
    <div id="status" class="status"></div>
    <!-- SEARCH -->
    <section class="block">
      <input type="text" id="searchBox" class="input-box" placeholder="Search lecture...">
      <button onclick="search()">Search</button>
      <div id="searchProgress"></div>
    </section>

    <!-- VIDEO -->
    <video id="video" controls></video>

    <!-- SEARCH RESULTS -->
    <section class="block">
      <div id="results"></div>
    </section>

  </main>

  <!-- FOOTER -->
  <footer class="footer">
    <div class="container footer-content">
      © 2026 AI Lecture Search – DSV Stockholm University
    </div>
  </footer>

  <script src="app.js"></script>
</body>

</html>
