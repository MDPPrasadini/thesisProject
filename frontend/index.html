<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>AI Lecture Search - DSV</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- TOP BANNER -->
  <header class="top-banner">
    <div class="container banner-content">

      <img src="su_swe.png" class="logo" alt="Stockholm University Logo">

      <div class="banner-text">
        <div class="department">Department of Computer and Systems Sciences (DSV)</div>
      </div>

    </div>
  </header>

  <!-- MAIN CONTENT -->
  <main class="container content">

    <h1>AI Lecture Search</h1>

    <!-- UPLOAD SECTION -->
    <section class="block">
      <input type="file" id="fileInput" class="input-box">
      <button onclick="upload()" class="btn">Upload Lecture</button>
      <div id="uploadProgress" class="progress"></div>
    </section>

    <!-- SEARCH SECTION -->
    <section class="block">
      <input type="text" id="searchBox" class="input-box" placeholder="Search lecture...">
      <button onclick="search()" class="btn">Search</button>
      <div id="searchProgress" class="progress"></div>
    </section>

    <!-- VIDEO -->
    <section class="block">
      <video id="video" controls></video>
    </section>
    <!-- STATUS -->
    <div id="status" class="status"></div>

    <!-- PROGRESS BAR -->
    <div id="progressContainer" class="progress-container">
      <div id="progressBar" class="progress-bar"></div>
    </div>
    <!-- RESULTS -->
    <section class="block">
      <div id="results"></div>
    </section>

  </main>

  <!-- FOOTER -->
  <footer class="footer">
    <div class="container footer-content">
      © 2026 AI Lecture Search – Master Thesis Project, Department of Computer and Systems Sciences (DSV), Stockholm
      University
    </div>
  </footer>

  <script src="app.js"></script>
</body>

</html>
